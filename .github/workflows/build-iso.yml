name: Build ISO

# Builds the minimal installer ISO with build_iso.sh, writes SHA256SUMS and uploads everything as artifacts.
# Also called by release.yml.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "build_iso.sh"
      - "VERSION"
      - "tools/**"
      - "rootfs/**"
      - "profiles/**"
      - "get"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools mtools cpio busybox-static cryptsetup efibootmgr \
            dosfstools grub-efi-amd64-bin grub-pc-bin grub2-common grub-common libncurses-dev build-essential curl \
            kmod zstd xz-utils ovmf qemu-system-x86

      - name: Build ISO
        run: ./build_iso.sh

      - name: Smoke test (boot the ISO headless in QEMU)
        run: |
          VERSION=$(cat VERSION)
          ISO="systemLinux-$VERSION-x86_64.iso"
          mkdir -p smoke
          # boot the ISO's own kernel and initramfs (so console=ttyS0 can be added) with the ISO as the CD-ROM
          xorriso -osirrox on -indev "$ISO" -extract /live/vmlinuz smoke/vmlinuz -extract /live/initrd.img smoke/initrd.img
          chmod 644 smoke/*
          : > smoke/serial.log
          qemu-system-x86_64 -m 2G -smp 2 -no-reboot -cdrom "$ISO" \
            -kernel smoke/vmlinuz -initrd smoke/initrd.img -append "console=ttyS0 loglevel=3" \
            -serial file:smoke/serial.log -display none &
          QPID=$!
          ok=0
          for i in $(seq 1 90); do
            if grep -q 'could not find the live medium' smoke/serial.log; then break; fi
            if grep -qE '\[live\] medium found|login:' smoke/serial.log; then ok=1; break; fi
            sleep 2
          done
          kill $QPID 2>/dev/null || true
          cat smoke/serial.log
          [ "$ok" = 1 ] || { echo "smoke test failed: live medium not found"; exit 1; }

      - name: Generate checksums
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist
          mv "systemLinux-$VERSION-x86_64.iso" "systemLinux-$VERSION-x86_64.iso.sha256" dist/
          if [ -d profiles-out ]; then cp profiles-out/* dist/; fi
          cd dist
          sha256sum -- * | grep -v '\.sha256$' > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: systemLinux-iso
          path: dist/*
          if-no-files-found: error
