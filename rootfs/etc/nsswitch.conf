# /etc/nsswitch.conf: name service switch configuration.
# systemLinux has no systemd, so there are no systemd/resolve/myhostname/mymachines NSS modules:
# accounts come from the files in /etc, host names from /etc/hosts and then DNS.

aliases:    files
ethers:     files
group:      files
gshadow:    files
hosts:      files dns
# Allow initgroups to default to the setting for group.
# initgroups: files
netgroup:   files
networks:   files dns
passwd:     files
protocols:  files
publickey:  files
rpc:        files
shadow:     files
services:   files
